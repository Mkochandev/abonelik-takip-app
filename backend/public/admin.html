<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — Abonelik Kataloğu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #F2F1F4;
    --card: #FFFFFF;
    --text: #15131A;
    --text2: #5F5B66;
    --divider: #E6E4EA;
    --field: #F2F1F4;
    --primary: #15131A;
    --on-primary: #FFFFFF;
    --danger: #C4321C;
    --ok: #16A34A;
    --radius-card: 24px;
    --radius-input: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    color: var(--text);
    background: var(--bg);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .brand-subtitle {
    color: var(--text2);
    font-size: 13px;
    margin-top: 2px;
  }

  h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 12px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 20px;
  }

  #mainSection {
    display: none;
  }

  #authSection {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #authSection input {
    flex: 1;
  }

  input, select, button {
    font-size: 14px;
    font-family: inherit;
  }

  input, select {
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-input);
    background: var(--field);
    color: var(--text);
  }

  input::placeholder {
    color: var(--text2);
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 700;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.85;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  button.danger {
    background: transparent;
    color: var(--danger);
    padding: 10px 8px;
    font-weight: 600;
  }

  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--text);
  }

  #catalogBody button[data-action="edit"] {
    background: transparent;
    color: var(--text);
    text-decoration: underline;
    font-weight: 600;
    padding: 10px 8px;
  }

  #newForm {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #newForm input, #newForm select {
    flex: 1;
    min-width: 120px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }

  th {
    color: var(--text2);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  td.actions {
    display: flex;
    gap: 4px;
    border-bottom: none;
    align-items: center;
  }

  td.actions button {
    white-space: nowrap;
  }

  #status {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 600;
  }

  #status.error {
    color: var(--danger);
  }

  #status.ok {
    color: var(--ok);
  }

  .price-input {
    width: 90px;
  }

  #scanSection {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #scanStatus {
    font-size: 13px;
    color: var(--text2);
  }

  a {
    color: var(--text);
  }

  input[type="checkbox"] {
    width: 16px;
    height: 16px;
    padding: 0;
    margin: 0;
    accent-color: var(--primary);
  }

  .logo-tile {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--field);
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 16px;
  }

  .logo-tile img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: var(--card);
  }

  .domain-hint {
    color: var(--text2);
    font-size: 12px;
    margin-top: 2px;
  }

  .catalog-filter {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 14px;
    cursor: pointer;
  }

  #missingLogoCount {
    color: var(--text2);
  }

  .form-with-preview {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .form-with-preview > :first-child {
    flex: 1;
  }

  .logo-fields {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .logo-fields input {
    flex: 1;
    min-width: 220px;
  }

  .logo-preview {
    display: flex;
    gap: 8px;
  }

  .logo-preview-box {
    width: 88px;
    height: 88px;
    border-radius: var(--radius-input);
    border: 1px solid var(--divider);
    background: #FFFFFF;
    color: var(--text2);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: 11px;
    padding: 6px;
  }

  .logo-preview-box.dark {
    background: #15131A;
    border-color: #15131A;
    color: #A9A5B0;
  }

  .logo-preview-box img {
    width: 56px;
    height: 56px;
    object-fit: contain;
    border-radius: 12px;
  }

  .form-error {
    color: var(--danger);
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px;
  }

  .form-error:empty {
    display: none;
  }

  tr.edit-logo-row td {
    padding-top: 0;
  }

  tr.editing td {
    border-bottom: none;
  }
</style>
</head>
<body>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="114" fill="#15131A" />
      <path
        d="M 54.0 318.0 C 56.0 314.2 62.0 300.7 66.0 295.4 C 70.0 290.0 74.0 286.0 78.0 286.0 C 82.0 286.0 86.0 290.0 90.0 295.4 C 94.0 300.7 98.0 310.5 102.0 318.0 C 106.0 325.5 110.0 335.3 114.0 340.6 C 118.0 346.0 122.0 350.0 126.0 350.0 C 130.0 350.0 134.0 346.0 138.0 340.6 C 142.0 335.3 146.0 325.5 150.0 318.0 C 154.0 310.5 158.0 300.7 162.0 295.4 C 166.0 290.0 170.0 286.0 174.0 286.0 C 178.0 286.0 182.0 290.0 186.0 295.4 C 190.0 300.7 194.0 310.5 198.0 318.0 C 202.0 325.5 206.0 335.3 210.0 340.6 C 214.0 346.0 218.0 350.0 222.0 350.0 C 226.0 350.0 230.0 346.0 234.0 340.6 C 238.0 335.3 242.0 325.5 246.0 318.0 C 250.0 310.5 254.0 300.7 258.0 295.4 C 262.0 290.0 268.0 287.6 270.0 286.0"
        stroke="#FFC53D" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"
      />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FFC53D" transform="translate(331.1 278) rotate(-16.5)" />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FF8A3D" transform="translate(391.4 243.5) rotate(-43.8)" />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FF5E57" transform="translate(429.5 187.7) rotate(-65.8)" />
    </svg>
    <div>
      <div class="brand-name">erişte</div>
      <div class="brand-subtitle">Admin Panel · Abonelik Kataloğu</div>
    </div>
  </div>

  <div id="authSection" class="card">
    <input id="secretInput" type="password" placeholder="Admin secret" />
    <button id="connectButton">Bağlan</button>
  </div>

  <div id="mainSection">
    <div id="scanSection" class="card">
      <button id="scanButton">Fiyatları Tara</button>
      <span id="scanStatus"></span>
    </div>

    <div class="card">
      <h2>Yeni Ekle</h2>
      <div class="form-with-preview">
        <form id="newForm">
          <input id="newAppName" placeholder="app_name" required />
          <input id="newPlanName" placeholder="plan_name" />
          <input id="newPrice" type="number" step="0.01" placeholder="current_price" required />
          <input id="newCurrency" placeholder="currency (örn. TRY)" />
          <select id="newCategory"></select>
          <input id="newSourceUrl" placeholder="source_url" />
          <input id="newCancelUrl" placeholder="İptal URL" />
          <input id="newDomain" placeholder="Alan adı (örn. netflix.com)" />
          <input id="newLogoUrl" placeholder="Logo URL (opsiyonel, alan adını geçersiz kılar)" />
          <button type="submit">Ekle</button>
        </form>
        <div class="logo-preview">
          <div class="logo-preview-box" id="newPreviewLight"></div>
          <div class="logo-preview-box dark" id="newPreviewDark"></div>
        </div>
      </div>
      <div class="form-error" id="newFormError"></div>
    </div>

    <div class="card">
      <h2>Katalog</h2>
      <label class="catalog-filter">
        <input id="missingLogoFilter" type="checkbox" />
        Sadece logosu eksikler
        <span id="missingLogoCount"></span>
      </label>
      <table>
        <thead>
          <tr>
            <th></th>
            <th>app_name</th>
            <th>plan_name</th>
            <th>current_price</th>
            <th>currency</th>
            <th>category</th>
            <th>İptal URL</th>
            <th>last_checked_at</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="catalogBody"></tbody>
      </table>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const API_BASE = "/api/admin/catalog";
    const CONFIG_URL = "/api/admin/config";
    const CATEGORIES = [
      "Video/Dizi-Film",
      "Müzik",
      "Kitap/Sesli Kitap",
      "Yapay Zeka",
      "Bulut Depolama",
      "Üretkenlik/Tasarım",
      "Spor",
    ];
    // Mobil uygulamadaki kategori pastelleri (baş harf karosu zemini).
    const CATEGORY_COLORS = {
      "Video/Dizi-Film": "#D7D2FB",
      "Müzik": "#F9D0E6",
      "Kitap/Sesli Kitap": "#FFD9B8",
      "Yapay Zeka": "#C6EEDF",
      "Bulut Depolama": "#CFE5FB",
      "Üretkenlik/Tasarım": "#FBE7A8",
      "Spor": "#FFD0CC",
    };
    const LOGO_PREVIEW_DEBOUNCE_MS = 400;
    let adminSecret = sessionStorage.getItem("adminSecret") || "";
    let catalogCache = [];
    let editingId = null;
    let logodevKey = "";
    let onlyMissingLogo = false;

    function categoryOptionsHtml(selected) {
      const emptyOption = `<option value="" ${!selected ? "selected" : ""}>—</option>`;
      const options = CATEGORIES.map(
        (category) =>
          `<option value="${category}" ${category === selected ? "selected" : ""}>${category}</option>`
      ).join("");

      return emptyOption + options;
    }

    document.getElementById("newCategory").innerHTML = categoryOptionsHtml(null);

    const authSection = document.getElementById("authSection");
    const mainSection = document.getElementById("mainSection");
    const secretInput = document.getElementById("secretInput");
    const statusEl = document.getElementById("status");
    const catalogBody = document.getElementById("catalogBody");
    const newForm = document.getElementById("newForm");

    function setStatus(message, type) {
      statusEl.textContent = message || "";
      statusEl.className = type || "";
    }

    function showAuthenticated() {
      authSection.style.display = "none";
      mainSection.style.display = "block";
    }

    function showLoggedOut() {
      authSection.style.display = "flex";
      mainSection.style.display = "none";
    }

    async function apiRequest(path, options = {}, base = API_BASE) {
      const response = await fetch(base + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Secret": adminSecret,
          ...(options.headers || {}),
        },
      });

      if (response.status === 401) {
        sessionStorage.removeItem("adminSecret");
        adminSecret = "";
        showLoggedOut();
        throw new Error("Admin secret geçersiz");
      }

      if (response.status === 204) {
        return null;
      }

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error((data && data.error) || "Bilinmeyen bir hata oluştu");
      }

      return data;
    }

    async function loadCatalog() {
      try {
        const data = await apiRequest("", { method: "GET" });
        catalogCache = data.catalog;
        renderTable();
        setStatus("");
      } catch (err) {
        setStatus(err.message, "error");
      }
    }

    // Logo.dev anahtarı alınamazsa alan adından logo üretilemez; liste baş
    // harf karolarıyla çalışmaya devam eder.
    async function loadConfig() {
      try {
        const config = await apiRequest("", { method: "GET" }, CONFIG_URL);
        logodevKey = config.logodevKey || "";
      } catch (err) {
        logodevKey = "";
      }
    }

    // Backend'deki parseDomain ile aynı temizlik; önizleme kaydedilecek
    // alan adını göstersin diye.
    function normalizeDomain(value) {
      return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/^https?:\/\//, "")
        .replace(/^www\./, "")
        .replace(/[/?#].*$/, "");
    }

    function logodevUrl(domain, size, theme) {
      if (!domain || !logodevKey) return null;

      return (
        `https://img.logo.dev/${encodeURIComponent(domain)}` +
        `?token=${encodeURIComponent(logodevKey)}&size=${size}&format=png&fallback=404` +
        (theme ? `&theme=${theme}` : "")
      );
    }

    function isMissingLogo(item) {
      return !item.domain && !item.logo_url;
    }

    // Baş harf karosu her zaman altta durur; görsel yüklenirse üstünü
    // kapatır, yüklenemezse kaldırılır ve karo görünür kalır.
    function logoTileHtml(item) {
      const src = item.logo_url || logodevUrl(item.domain, 80);
      const letter = (item.app_name || "").trim().charAt(0).toUpperCase() || "?";
      const color = CATEGORY_COLORS[item.category] || "var(--field)";
      const image = src ? `<img src="${escapeHtml(src)}" alt="" loading="lazy" />` : "";

      return `<div class="logo-tile" style="background: ${color}">${escapeHtml(letter)}${image}</div>`;
    }

    function renderLogoPreview(prefix) {
      const domainInput = document.getElementById(`${prefix}Domain`);
      const logoUrlInput = document.getElementById(`${prefix}LogoUrl`);
      if (!domainInput || !logoUrlInput) return;

      const domain = normalizeDomain(domainInput.value);
      const logoUrl = logoUrlInput.value.trim();

      for (const [suffix, theme] of [["Light", null], ["Dark", "dark"]]) {
        const box = document.getElementById(`${prefix}Preview${suffix}`);
        box.textContent = "";

        if (!domain && !logoUrl) {
          box.textContent = "Önizleme";
          continue;
        }

        if (!logoUrl && !logodevKey) {
          box.textContent = "Logo.dev anahtarı yok";
          continue;
        }

        const src = logoUrl
          ? logoUrl.startsWith("https://") ? logoUrl : null
          : logodevUrl(domain, 128, theme);

        if (!src) {
          box.textContent = "Logo bulunamadı";
          continue;
        }

        const image = document.createElement("img");
        image.alt = "";
        image.addEventListener("error", () => {
          if (image.parentNode === box) {
            box.textContent = "Logo bulunamadı";
          }
        });
        image.src = src;
        box.appendChild(image);
      }
    }

    // Her tuş vuruşunda Logo.dev'e istek atmamak için önizleme geciktirilir.
    const logoPreviewTimers = {};

    function scheduleLogoPreview(prefix) {
      clearTimeout(logoPreviewTimers[prefix]);
      logoPreviewTimers[prefix] = setTimeout(
        () => renderLogoPreview(prefix),
        LOGO_PREVIEW_DEBOUNCE_MS
      );
    }

    function setFormError(id, message) {
      const el = document.getElementById(id);
      if (el) {
        el.textContent = message || "";
      }
    }

    function renderTable() {
      catalogBody.innerHTML = "";

      const missingCount = catalogCache.filter(isMissingLogo).length;
      document.getElementById("missingLogoCount").textContent = `(${missingCount} eksik)`;

      const visibleItems = onlyMissingLogo ? catalogCache.filter(isMissingLogo) : catalogCache;

      if (visibleItems.length === 0) {
        catalogBody.innerHTML = `<tr><td colspan="9">${
          onlyMissingLogo ? "Logosu eksik kayıt yok." : "Kayıt yok."
        }</td></tr>`;
      }

      for (const item of visibleItems) {
        const row = document.createElement("tr");
        const isEditing = editingId === item.id;

        const priceCell = isEditing
          ? `<input class="price-input" type="number" step="0.01" value="${item.current_price}" id="editPriceInput" />`
          : escapeHtml(item.current_price);

        const actionsCell = isEditing
          ? `<button data-action="save" data-id="${item.id}">Kaydet</button>
             <button class="secondary" data-action="cancel">İptal</button>`
          : `<button data-action="edit" data-id="${item.id}">Düzenle</button>
             <button class="danger" data-action="delete" data-id="${item.id}">Sil</button>`;

        const categoryCell = isEditing
          ? `<select id="editCategoryInput">${categoryOptionsHtml(item.category)}</select>`
          : escapeHtml(item.category || "—");

        const cancelUrlCell = isEditing
          ? `<input id="editCancelUrlInput" placeholder="İptal URL" value="${escapeHtml(item.cancel_url || "")}" />`
          : item.cancel_url
          ? `<a href="${escapeHtml(item.cancel_url)}" target="_blank" rel="noopener">link</a>`
          : "—";

        const domainHint =
          !isEditing && (item.logo_url || item.domain)
            ? `<div class="domain-hint">${item.logo_url ? "özel logo" : escapeHtml(item.domain)}</div>`
            : "";

        row.className = isEditing ? "editing" : "";
        row.innerHTML = `
          <td>${logoTileHtml(item)}</td>
          <td>${escapeHtml(item.app_name)}${domainHint}</td>
          <td>${escapeHtml(item.plan_name || "")}</td>
          <td>${priceCell} ${!isEditing ? escapeHtml(item.currency) : ""}</td>
          <td>${escapeHtml(item.currency)}</td>
          <td>${categoryCell}</td>
          <td>${cancelUrlCell}</td>
          <td>${item.last_checked_at ? new Date(item.last_checked_at).toLocaleString("tr-TR") : "—"}</td>
          <td class="actions">${actionsCell}</td>
        `;

        catalogBody.appendChild(row);

        if (isEditing) {
          const logoRow = document.createElement("tr");
          logoRow.className = "edit-logo-row";
          logoRow.innerHTML = `
            <td></td>
            <td colspan="8">
              <div class="form-with-preview">
                <div class="logo-fields">
                  <input id="editDomain" placeholder="Alan adı (örn. netflix.com)" value="${escapeHtml(item.domain || "")}" />
                  <input id="editLogoUrl" placeholder="Logo URL (opsiyonel, alan adını geçersiz kılar)" value="${escapeHtml(item.logo_url || "")}" />
                </div>
                <div class="logo-preview">
                  <div class="logo-preview-box" id="editPreviewLight"></div>
                  <div class="logo-preview-box dark" id="editPreviewDark"></div>
                </div>
              </div>
              <div class="form-error" id="editFormError"></div>
            </td>
          `;
          catalogBody.appendChild(logoRow);
        }
      }

      renderLogoPreview("edit");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    catalogBody.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const id = button.dataset.id;

      if (action === "edit") {
        editingId = id;
        renderTable();
      } else if (action === "cancel") {
        editingId = null;
        renderTable();
      } else if (action === "delete") {
        if (!confirm("Bu kaydı silmek istediğine emin misin?")) return;

        try {
          await apiRequest(`/${id}`, { method: "DELETE" });
          setStatus("Kayıt silindi.", "ok");
          await loadCatalog();
        } catch (err) {
          setStatus(err.message, "error");
        }
      } else if (action === "save") {
        const newPrice = document.getElementById("editPriceInput").value;
        const newCategory = document.getElementById("editCategoryInput").value;
        const newCancelUrl = document.getElementById("editCancelUrlInput").value.trim();
        const newDomain = document.getElementById("editDomain").value.trim();
        const newLogoUrl = document.getElementById("editLogoUrl").value.trim();

        try {
          await apiRequest(`/${id}`, {
            method: "PUT",
            body: JSON.stringify({
              current_price: newPrice,
              category: newCategory || null,
              cancel_url: newCancelUrl || null,
              domain: newDomain,
              logo_url: newLogoUrl,
            }),
          });
          editingId = null;
          setStatus("Kayıt güncellendi.", "ok");
          await loadCatalog();
        } catch (err) {
          setFormError("editFormError", err.message);
        }
      }
    });

    // Yüklenemeyen liste logoları kaldırılır; altındaki baş harf karosu
    // görünür. "error" olayı yukarı taşmadığı için capture ile dinlenir.
    catalogBody.addEventListener(
      "error",
      (event) => {
        if (event.target.tagName === "IMG" && event.target.closest(".logo-tile")) {
          event.target.remove();
        }
      },
      true
    );

    catalogBody.addEventListener("input", (event) => {
      if (event.target.id === "editDomain" || event.target.id === "editLogoUrl") {
        scheduleLogoPreview("edit");
      }
    });

    document.getElementById("missingLogoFilter").addEventListener("change", (event) => {
      onlyMissingLogo = event.target.checked;
      renderTable();
    });

    document.getElementById("newDomain").addEventListener("input", () => scheduleLogoPreview("new"));
    document.getElementById("newLogoUrl").addEventListener("input", () => scheduleLogoPreview("new"));
    renderLogoPreview("new");

    newForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const body = {
        app_name: document.getElementById("newAppName").value.trim(),
        plan_name: document.getElementById("newPlanName").value.trim() || undefined,
        current_price: document.getElementById("newPrice").value,
        currency: document.getElementById("newCurrency").value.trim() || undefined,
        category: document.getElementById("newCategory").value || undefined,
        source_url: document.getElementById("newSourceUrl").value.trim() || undefined,
        cancel_url: document.getElementById("newCancelUrl").value.trim() || undefined,
        domain: document.getElementById("newDomain").value.trim() || undefined,
        logo_url: document.getElementById("newLogoUrl").value.trim() || undefined,
      };

      try {
        await apiRequest("", { method: "POST", body: JSON.stringify(body) });
        newForm.reset();
        document.getElementById("newCategory").value = "";
        setFormError("newFormError", "");
        renderLogoPreview("new");
        setStatus("Kayıt eklendi.", "ok");
        await loadCatalog();
      } catch (err) {
        setFormError("newFormError", err.message);
      }
    });

    const scanButton = document.getElementById("scanButton");
    const scanStatusEl = document.getElementById("scanStatus");

    const SCAN_POLL_INTERVAL_MS = 3000;
    let scanPollTimer = null;

    // Tarama durumunu ekrana yansıtır; tarama sürüyorsa true döner.
    function renderScanState(state) {
      if (state.status === "running") {
        const progress = state.progress && state.progress.total
          ? ` ${state.progress.done}/${state.progress.total}`
          : "";
        scanStatusEl.textContent = `Taranıyor...${progress} (birkaç dakika sürebilir)`;
        scanButton.disabled = true;
        return true;
      }

      scanButton.disabled = false;

      if (state.status === "completed" && state.summary) {
        const summary = state.summary;
        scanStatusEl.textContent =
          `Tarama bitti: ${summary.total} kayıt, ${summary.updated} güncellendi, ` +
          `${summary.unchanged} değişmedi, ${summary.failed} başarısız.`;
      } else if (state.status === "failed") {
        scanStatusEl.textContent = "";
        setStatus(`Tarama başarısız: ${state.error}`, "error");
      }

      return false;
    }

    function stopScanPolling() {
      if (scanPollTimer) {
        clearTimeout(scanPollTimer);
        scanPollTimer = null;
      }
    }

    async function pollScanStatus() {
      stopScanPolling();

      try {
        const state = await apiRequest("/scan-status", { method: "GET" });
        const running = renderScanState(state);

        if (running) {
          scanPollTimer = setTimeout(pollScanStatus, SCAN_POLL_INTERVAL_MS);
        } else if (state.status === "completed") {
          await loadCatalog();
        }
      } catch (err) {
        scanButton.disabled = false;
        setStatus(err.message, "error");
      }
    }

    scanButton.addEventListener("click", async () => {
      scanButton.disabled = true;
      scanStatusEl.textContent = "Tarama başlatılıyor...";

      try {
        const state = await apiRequest("/scan-prices", { method: "POST" });
        renderScanState(state);
        scanPollTimer = setTimeout(pollScanStatus, SCAN_POLL_INTERVAL_MS);
      } catch (err) {
        scanStatusEl.textContent = "";
        scanButton.disabled = false;
        setStatus(err.message, "error");
      }
    });

    // Sayfa açıldığında devam eden bir tarama varsa takibe devam et.
    async function resumeScanIfRunning() {
      try {
        const state = await apiRequest("/scan-status", { method: "GET" });
        if (state.status === "running") {
          renderScanState(state);
          scanPollTimer = setTimeout(pollScanStatus, SCAN_POLL_INTERVAL_MS);
        }
      } catch (err) {
        // Yok say; tarama durumu kritik değil.
      }
    }

    document.getElementById("connectButton").addEventListener("click", async () => {
      const value = secretInput.value.trim();
      if (!value) return;

      adminSecret = value;

      try {
        await apiRequest("", { method: "GET" });
        sessionStorage.setItem("adminSecret", adminSecret);
        showAuthenticated();
        await loadConfig();
        await loadCatalog();
        resumeScanIfRunning();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    if (adminSecret) {
      showAuthenticated();
      loadConfig().then(loadCatalog);
      resumeScanIfRunning();
    } else {
      showLoggedOut();
    }
  </script>
</body>
</html>
