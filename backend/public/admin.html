<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin Panel — Abonelik Kataloğu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --bg: #F2F1F4;
    --card: #FFFFFF;
    --text: #15131A;
    --text2: #5F5B66;
    --divider: #E6E4EA;
    --field: #F2F1F4;
    --primary: #15131A;
    --on-primary: #FFFFFF;
    --danger: #C4321C;
    --ok: #16A34A;
    --radius-card: 24px;
    --radius-input: 16px;
  }

  * {
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 16px 64px;
    color: var(--text);
    background: var(--bg);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .brand-name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.5px;
    line-height: 1;
  }

  .brand-subtitle {
    color: var(--text2);
    font-size: 13px;
    margin-top: 2px;
  }

  h2 {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 12px;
  }

  .card {
    background: var(--card);
    border-radius: var(--radius-card);
    padding: 20px;
    margin-bottom: 20px;
  }

  #mainSection {
    display: none;
  }

  #authSection {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #authSection input {
    flex: 1;
  }

  input, select, button {
    font-size: 14px;
    font-family: inherit;
  }

  input, select {
    padding: 10px 14px;
    border: none;
    border-radius: var(--radius-input);
    background: var(--field);
    color: var(--text);
  }

  input::placeholder {
    color: var(--text2);
  }

  button {
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    background: var(--primary);
    color: var(--on-primary);
    font-weight: 700;
    cursor: pointer;
  }

  button:hover {
    opacity: 0.85;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  button.danger {
    background: transparent;
    color: var(--danger);
    padding: 10px 8px;
    font-weight: 600;
  }

  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1.5px solid var(--text);
  }

  #catalogBody button[data-action="edit"] {
    background: transparent;
    color: var(--text);
    text-decoration: underline;
    font-weight: 600;
    padding: 10px 8px;
  }

  #newForm {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  #newForm input, #newForm select {
    flex: 1;
    min-width: 120px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  th, td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--divider);
    font-size: 14px;
  }

  th {
    color: var(--text2);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  td.actions {
    display: flex;
    gap: 4px;
    border-bottom: none;
    align-items: center;
  }

  td.actions button {
    white-space: nowrap;
  }

  #status {
    margin-top: 12px;
    font-size: 14px;
    font-weight: 600;
  }

  #status.error {
    color: var(--danger);
  }

  #status.ok {
    color: var(--ok);
  }

  .price-input {
    width: 90px;
  }

  #scanSection {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #scanStatus {
    font-size: 13px;
    color: var(--text2);
  }

  a {
    color: var(--text);
  }
</style>
</head>
<body>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="114" fill="#15131A" />
      <path
        d="M 54.0 318.0 C 56.0 314.2 62.0 300.7 66.0 295.4 C 70.0 290.0 74.0 286.0 78.0 286.0 C 82.0 286.0 86.0 290.0 90.0 295.4 C 94.0 300.7 98.0 310.5 102.0 318.0 C 106.0 325.5 110.0 335.3 114.0 340.6 C 118.0 346.0 122.0 350.0 126.0 350.0 C 130.0 350.0 134.0 346.0 138.0 340.6 C 142.0 335.3 146.0 325.5 150.0 318.0 C 154.0 310.5 158.0 300.7 162.0 295.4 C 166.0 290.0 170.0 286.0 174.0 286.0 C 178.0 286.0 182.0 290.0 186.0 295.4 C 190.0 300.7 194.0 310.5 198.0 318.0 C 202.0 325.5 206.0 335.3 210.0 340.6 C 214.0 346.0 218.0 350.0 222.0 350.0 C 226.0 350.0 230.0 346.0 234.0 340.6 C 238.0 335.3 242.0 325.5 246.0 318.0 C 250.0 310.5 254.0 300.7 258.0 295.4 C 262.0 290.0 268.0 287.6 270.0 286.0"
        stroke="#FFC53D" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" fill="none"
      />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FFC53D" transform="translate(331.1 278) rotate(-16.5)" />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FF8A3D" transform="translate(391.4 243.5) rotate(-43.8)" />
      <rect x="-26" y="-26" width="52" height="52" rx="15" fill="#FF5E57" transform="translate(429.5 187.7) rotate(-65.8)" />
    </svg>
    <div>
      <div class="brand-name">erişte</div>
      <div class="brand-subtitle">Admin Panel · Abonelik Kataloğu</div>
    </div>
  </div>

  <div id="authSection" class="card">
    <input id="secretInput" type="password" placeholder="Admin secret" />
    <button id="connectButton">Bağlan</button>
  </div>

  <div id="mainSection">
    <div id="scanSection" class="card">
      <button id="scanButton">Fiyatları Tara</button>
      <span id="scanStatus"></span>
    </div>

    <div class="card">
      <h2>Yeni Ekle</h2>
      <form id="newForm">
        <input id="newAppName" placeholder="app_name" required />
        <input id="newPlanName" placeholder="plan_name" />
        <input id="newPrice" type="number" step="0.01" placeholder="current_price" required />
        <input id="newCurrency" placeholder="currency (örn. TRY)" />
        <select id="newCategory"></select>
        <input id="newSourceUrl" placeholder="source_url" />
        <input id="newCancelUrl" placeholder="İptal URL" />
        <button type="submit">Ekle</button>
      </form>
    </div>

    <div class="card">
      <h2>Katalog</h2>
      <table>
        <thead>
          <tr>
            <th>app_name</th>
            <th>plan_name</th>
            <th>current_price</th>
            <th>currency</th>
            <th>category</th>
            <th>İptal URL</th>
            <th>last_checked_at</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="catalogBody"></tbody>
      </table>
    </div>
  </div>

  <div id="status"></div>

  <script>
    const API_BASE = "/api/admin/catalog";
    const CATEGORIES = [
      "Video/Dizi-Film",
      "Müzik",
      "Kitap/Sesli Kitap",
      "Yapay Zeka",
      "Bulut Depolama",
      "Üretkenlik/Tasarım",
      "Spor",
    ];
    let adminSecret = sessionStorage.getItem("adminSecret") || "";
    let catalogCache = [];
    let editingId = null;

    function categoryOptionsHtml(selected) {
      const emptyOption = `<option value="" ${!selected ? "selected" : ""}>—</option>`;
      const options = CATEGORIES.map(
        (category) =>
          `<option value="${category}" ${category === selected ? "selected" : ""}>${category}</option>`
      ).join("");

      return emptyOption + options;
    }

    document.getElementById("newCategory").innerHTML = categoryOptionsHtml(null);

    const authSection = document.getElementById("authSection");
    const mainSection = document.getElementById("mainSection");
    const secretInput = document.getElementById("secretInput");
    const statusEl = document.getElementById("status");
    const catalogBody = document.getElementById("catalogBody");
    const newForm = document.getElementById("newForm");

    function setStatus(message, type) {
      statusEl.textContent = message || "";
      statusEl.className = type || "";
    }

    function showAuthenticated() {
      authSection.style.display = "none";
      mainSection.style.display = "block";
    }

    function showLoggedOut() {
      authSection.style.display = "flex";
      mainSection.style.display = "none";
    }

    async function apiRequest(path, options = {}) {
      const response = await fetch(API_BASE + path, {
        ...options,
        headers: {
          "Content-Type": "application/json",
          "X-Admin-Secret": adminSecret,
          ...(options.headers || {}),
        },
      });

      if (response.status === 401) {
        sessionStorage.removeItem("adminSecret");
        adminSecret = "";
        showLoggedOut();
        throw new Error("Admin secret geçersiz");
      }

      if (response.status === 204) {
        return null;
      }

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error((data && data.error) || "Bilinmeyen bir hata oluştu");
      }

      return data;
    }

    async function loadCatalog() {
      try {
        const data = await apiRequest("", { method: "GET" });
        catalogCache = data.catalog;
        renderTable();
        setStatus("");
      } catch (err) {
        setStatus(err.message, "error");
      }
    }

    function renderTable() {
      catalogBody.innerHTML = "";

      for (const item of catalogCache) {
        const row = document.createElement("tr");
        const isEditing = editingId === item.id;

        const priceCell = isEditing
          ? `<input class="price-input" type="number" step="0.01" value="${item.current_price}" id="editPriceInput" />`
          : escapeHtml(item.current_price);

        const actionsCell = isEditing
          ? `<button data-action="save" data-id="${item.id}">Kaydet</button>
             <button class="secondary" data-action="cancel">İptal</button>`
          : `<button data-action="edit" data-id="${item.id}">Düzenle</button>
             <button class="danger" data-action="delete" data-id="${item.id}">Sil</button>`;

        const categoryCell = isEditing
          ? `<select id="editCategoryInput">${categoryOptionsHtml(item.category)}</select>`
          : escapeHtml(item.category || "—");

        const cancelUrlCell = isEditing
          ? `<input id="editCancelUrlInput" placeholder="İptal URL" value="${escapeHtml(item.cancel_url || "")}" />`
          : item.cancel_url
          ? `<a href="${escapeHtml(item.cancel_url)}" target="_blank" rel="noopener">link</a>`
          : "—";

        row.innerHTML = `
          <td>${escapeHtml(item.app_name)}</td>
          <td>${escapeHtml(item.plan_name || "")}</td>
          <td>${priceCell} ${!isEditing ? escapeHtml(item.currency) : ""}</td>
          <td>${escapeHtml(item.currency)}</td>
          <td>${categoryCell}</td>
          <td>${cancelUrlCell}</td>
          <td>${item.last_checked_at ? new Date(item.last_checked_at).toLocaleString("tr-TR") : "—"}</td>
          <td class="actions">${actionsCell}</td>
        `;

        catalogBody.appendChild(row);
      }
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[ch]));
    }

    catalogBody.addEventListener("click", async (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      const action = button.dataset.action;
      const id = button.dataset.id;

      if (action === "edit") {
        editingId = id;
        renderTable();
      } else if (action === "cancel") {
        editingId = null;
        renderTable();
      } else if (action === "delete") {
        if (!confirm("Bu kaydı silmek istediğine emin misin?")) return;

        try {
          await apiRequest(`/${id}`, { method: "DELETE" });
          setStatus("Kayıt silindi.", "ok");
          await loadCatalog();
        } catch (err) {
          setStatus(err.message, "error");
        }
      } else if (action === "save") {
        const newPrice = document.getElementById("editPriceInput").value;
        const newCategory = document.getElementById("editCategoryInput").value;
        const newCancelUrl = document.getElementById("editCancelUrlInput").value.trim();

        try {
          await apiRequest(`/${id}`, {
            method: "PUT",
            body: JSON.stringify({
              current_price: newPrice,
              category: newCategory || null,
              cancel_url: newCancelUrl || null,
            }),
          });
          editingId = null;
          setStatus("Fiyat güncellendi.", "ok");
          await loadCatalog();
        } catch (err) {
          setStatus(err.message, "error");
        }
      }
    });

    newForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const body = {
        app_name: document.getElementById("newAppName").value.trim(),
        plan_name: document.getElementById("newPlanName").value.trim() || undefined,
        current_price: document.getElementById("newPrice").value,
        currency: document.getElementById("newCurrency").value.trim() || undefined,
        category: document.getElementById("newCategory").value || undefined,
        source_url: document.getElementById("newSourceUrl").value.trim() || undefined,
        cancel_url: document.getElementById("newCancelUrl").value.trim() || undefined,
      };

      try {
        await apiRequest("", { method: "POST", body: JSON.stringify(body) });
        newForm.reset();
        document.getElementById("newCategory").value = "";
        setStatus("Kayıt eklendi.", "ok");
        await loadCatalog();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    const scanButton = document.getElementById("scanButton");
    const scanStatusEl = document.getElementById("scanStatus");

    scanButton.addEventListener("click", async () => {
      scanButton.disabled = true;
      scanStatusEl.textContent = "Taranıyor... (birkaç dakika sürebilir)";

      try {
        const summary = await apiRequest("/scan-prices", { method: "POST" });
        scanStatusEl.textContent =
          `Tarama bitti: ${summary.total} kayıt, ${summary.updated} güncellendi, ` +
          `${summary.unchanged} değişmedi, ${summary.failed} başarısız.`;
        await loadCatalog();
      } catch (err) {
        scanStatusEl.textContent = "";
        setStatus(err.message, "error");
      } finally {
        scanButton.disabled = false;
      }
    });

    document.getElementById("connectButton").addEventListener("click", async () => {
      const value = secretInput.value.trim();
      if (!value) return;

      adminSecret = value;

      try {
        await apiRequest("", { method: "GET" });
        sessionStorage.setItem("adminSecret", adminSecret);
        showAuthenticated();
        await loadCatalog();
      } catch (err) {
        setStatus(err.message, "error");
      }
    });

    if (adminSecret) {
      showAuthenticated();
      loadCatalog();
    } else {
      showLoggedOut();
    }
  </script>
</body>
</html>
